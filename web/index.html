<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Q-CHAS: cosmic-topology and horizon-information analytics on real Planck, WMAP, SPHEREx and LIGO data (NASA Space Apps)."
    />
    <title>Q-CHAS · The shape of space, the fate of information</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@300;400;600&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // apply the stored theme before first paint (dark by default)
      try {
        var t = localStorage.getItem('qchas.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      html { background: #03050b; }
      html[data-theme='light'] { background: #eef1f6; }
    </style>
  </head>
  <body>
    <noscript>Q-CHAS needs JavaScript to load its data bundles and render the analyses.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
