name: CI

on:
  push:
  pull_request:

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cache CAMB transfer functions and torus covariances
        uses: actions/cache@v4
        with:
          path: data/cache
          key: qchas-cache-${{ hashFiles('qchas/cmb/transfer.py', 'qchas/cmb/covariance.py', 'qchas/constants.py') }}
      - name: Cache public datasets
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('qchas/data/registry.py') }}
      - name: Fetch real datasets (WMAP, Planck spectra, LIGO strain, GWOSC catalog)
        run: qchas fetch
      - name: Unit and validation tests
        run: pytest -m "not slow" -q

  genesis:
    # Project Baby Universe - Genesis Branch: symbolic derivations, branch
    # atlas, tunnelling identities, thick walls (genesis/CODE)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r genesis/CODE/requirements.txt
      - name: Derivations, numerics and identities
        run: python -m pytest genesis/CODE/tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
